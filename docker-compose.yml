services:
  atendefacil:
    build:
      context: .
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/atendefacil}
    container_name: atendefacil
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - atendefacil_data:/data
volumes:
  atendefacil_data:
